<!DOCTYPE html>
<html>
<head>
  <title>SoftRains UI Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/frigate-login.js"></script>
  <script src="/static/dashboard-render.js"></script>  
  <link id="softrains-theme-icon" rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <!-- Container for Frigate login modal -->
  <div id="frigate-modal-container"></div>
  <div id="notification"></div>
  <div class="dashboard-header-bar">
    <div class="dashboard-logo-wrap">
      <img src="/static/images/logo.svg" alt="SoftRains Logo" class="dashboard-logo">
      <label class="nav-toggle" title="Toggle between Dashboard and Map">
        <input type="checkbox" class="nav-toggle-input" id="page-nav-toggle">
        <span class="nav-toggle-slider">
          <span class="nav-toggle-icon nav-toggle-icon-left">⚙️</span>
          <span class="nav-toggle-icon nav-toggle-icon-right">🗺️</span>
        </span>
      </label>
    </div>
    <script>
      document.getElementById('page-nav-toggle').addEventListener('change', function() {
        window.location.href = this.checked ? '/maps' : '/dashboard';
      });
    </script>
    <div class="theme-toggle-group">
      <button id="frigate-login-btn" class="frigate-login-btn" title="Login to Frigate">🔐 Frigate Login</button>
      <label class="theme-toggle-label" for="theme-toggle">
        <input type="checkbox" id="theme-toggle">
        <span>SoftRains Theme</span>
      </label>
      <button id="icon-modal-btn" type="button" style="margin-top:0.5em; display:none;">
        🖼️ Manage Icons
      </button>
    </div>
  </div>
  <h1>SoftRains Dashboard</h1>
  <div class="softrains-flex-row">
  <div class="softrains-table-container" id="actions-table-container" aria-label="Actions">
    </div>
    <div class="softrains-table-container" id="devices-table-container"></div>
  </div>
  <!-- Modal for add/edit -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal-box" id="modal-box">
      <span class="modal-close" id="modal-close" onclick="closeModal()">&times;</span>
      <div id="modal-content"></div>
    </div>
  </div>
  <!-- Detection Zone/Type Modal -->
  <div id="zone-type-modal" style="display:none;">
    <div id="zone-type-modal-box">
      <span id="zone-type-modal-close" onclick="closeZoneTypeModal()">&times;</span>
      <h3>Detection Zones &amp; Types</h3>
      <div id="zone-type-list-container">
        <div id="zone-type-list"></div>
      </div>
      <div style="margin-top:1em;">
        <button id="ai-assist-btn" disabled style="opacity:0.5;cursor:not-allowed;">
          🤖 AI Assist (Coming Eventually)
        </button>
        <button onclick="saveZoneTypePrefs()">Save Preferences</button>
      </div>
    </div>
  </div>
  <!-- Frigate Login Modal -->
  <script>
    function openFrigateLoginModal() {
      showFrigateLoginModal();
    }
    document.getElementById('frigate-login-btn').addEventListener('click', openFrigateLoginModal);
    window.softrainsData = {
      cameras: {{.CamerasJSON}},
      actions: {{.ActionsJSON}},
      devices: {{.DevicesJSON}}
    };
    renderDashboard(window.softrainsData);
  </script>
</body>
</html>
