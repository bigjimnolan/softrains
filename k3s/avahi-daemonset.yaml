apiVersion: v1
kind: ConfigMap
metadata:
  name: avahi-config
  namespace: softrains
data:
  avahi-daemon.conf: |
    [server]
    host-name=k3s-node
    domain-name=local
    use-ipv4=yes
    use-ipv6=yes
    allow-point-to-point=yes
    cache-entries-max=0

    [publish]
    publish-addresses=yes
    publish-hinfo=yes
    publish-workstation=yes
    publish-domain=yes
    publish-probe-only=no
    disable-user-service-publishing=yes

    [reflector]
    enable-reflector=yes
    reflect-ipv=no
    reflect-filters=

    [rlimits]
    enable-dbus=no
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: avahi-reflector
  namespace: softrains
spec:
  selector:
    matchLabels:
      app: avahi-reflector
  template:
    metadata:
      labels:
        app: avahi-reflector
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: avahi
        image: flungo/avahi:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: avahi-config
          mountPath: /etc/avahi/avahi-daemon.conf
          subPath: avahi-daemon.conf
          readOnly: true
      volumes:
      - name: avahi-config
        configMap:
          name: avahi-config
