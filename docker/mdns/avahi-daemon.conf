[server]
host-name=my-container
domain-name=local
use-ipv4=yes
use-ipv6=yes
allow-point-to-point=yes
cache-entries-max=0

[publish]
publish-addresses=yes
publish-hinfo=yes
publish-workstation=yes
publish-domain=yes
publish-probe-only=no
disable-user-service-publishing=yes

[reflector]
enable-reflector=no
reflect-ipv=no
reflect-filters=

[rlimits]
# Set to 'no' to disable D-Bus, necessary for containerized use
enable-dbus=no
